# Approved by the maintainer for TO-01 (ADR-009 PR-7, PR #43).
description = "Cube 10 x 10 x 10 mm, project orthotropic material with the catalog TO constants (E1 3000, E2 2400, E3 1800, G12 1000, G13 700, G23 650 MPa, nu12 0.35, nu13 = nu23 0.30; made up, not user-trusted data), material frame from the print setup, unstructured C3D10 mesh. Axial A1-A3 (build Z) and A1-side to A3-side (build (1, 0, 0)): rollers on x = 0, y = 0, z = 0, 10 MPa (ForceLoad 1000 N) on the opposite face. Shear S12, S13, S23 (build Z): simple shear, one face fixed in all dofs, 1000 N face forces as in ADR-009. Checked at every node: the loaded stress component, the five others, and u against the exact linear field"
source = "Exact homogeneous states of the orthotropic compliance eps = S sigma: Lekhnitskii, Theory of Elasticity of an Anisotropic Body, ch. 1; Jones, Mechanics of Composite Materials, 2nd ed. (1999), ch. 2 (locations unverified). Patch test (Irons); MacNeal & Harder, Finite Elements in Analysis and Design 1 (1985) 3-20 (unverified)"
