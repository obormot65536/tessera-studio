[project]
name = "tessera-mcp"
version = "0.0.1"
description = "Tessera Studio: mCP server for AI agents"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "tessera-core",
]

[tool.uv.sources]
tessera-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
