[project]
name = "tessera-model"
version = "0.0.1"
description = "Tessera Studio: shared data model, units and interfaces (bottom layer)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
