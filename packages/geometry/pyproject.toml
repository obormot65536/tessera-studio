[project]
name = "tessera-geometry"
version = "0.0.1"
description = "Tessera Studio: sTEP/STL/3MF import and geometry queries"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "tessera-model",
    "gmsh>=4.13",
    "trimesh>=4.4",
    "scipy>=1.11",
]

[tool.uv.sources]
tessera-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
