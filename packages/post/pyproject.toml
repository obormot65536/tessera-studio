[project]
name = "tessera-post"
version = "0.0.1"
description = "Tessera Studio: results post-processing"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "tessera-model",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.uv.sources]
tessera-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
