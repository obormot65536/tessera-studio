[project]
name = "tessera-solvers"
version = "0.0.1"
description = "Tessera Studio: solver adapters (CalculiX first)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "tessera-model",
]

[tool.uv.sources]
tessera-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
