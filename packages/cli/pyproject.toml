[project]
name = "tessera-cli"
version = "0.0.1"
description = "Tessera Studio: command-line interface"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "tessera-core",
    "typer>=0.12",
]

[project.scripts]
tessera = "tessera.cli.app:main"

[tool.uv.sources]
tessera-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]
