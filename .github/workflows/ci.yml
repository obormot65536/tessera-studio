name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The repository is public, so the token every job gets must not be able to write anything.
permissions:
  contents: read

# A new push to a PR cancels the run for its previous commit; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Markdown, docs/ and the licence never reach a test, so a change made only of them skips the
  # test jobs. They are skipped rather than left out of the run, so a required check still passes.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"  # new branch or forced push: test everything
            exit 0
          fi
          code=$(git diff --name-only "$BASE...$HEAD" | grep -vE '(\.md$|^docs/|^LICENSE$)' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # One job for the fast and solver tiers: the setup is shared, and the solver tests run only
  # once the fast tier has passed.
  test:
    name: Tests (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libxcursor1 libxinerama1 libxft2
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -m "not solver"
      - run: uv run pytest -m solver

  # Windows and macOS run the fast tier only on PRs labelled "windows" or "macos": changes to
  # that platform's behaviour (paths, packaging, native libraries, subprocess handling). There
  # it must pass. GitHub's macOS runners are often slow to start.
  fast-windows:
    name: Fast tier (windows-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true' && contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -m "not solver"

  fast-macos:
    name: Fast tier (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true' && contains(github.event.pull_request.labels.*.name, 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -m "not solver"
